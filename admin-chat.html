<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b8d6b0"><title>إدارة الشات | Alexorgant</title><link rel="stylesheet" href="style.css"><style>
body{min-height:100vh}.admin-chat-wrap{max-width:1100px;margin:35px auto;padding:0 16px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.admin-layout{display:grid;grid-template-columns:minmax(250px,360px) 1fr;gap:18px}.admin-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}.admin-card h2{margin:0 0 14px;font-size:18px}.login-card{max-width:420px;margin:10vh auto}.admin-input{display:block;width:100%;padding:11px;margin:8px 0 14px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text)}.conv-list{display:grid;gap:8px;max-height:70vh;overflow:auto}.conv-item{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:6px;text-align:right;padding:12px}.conv-item.active{border-color:var(--green-deep);background:var(--green)}.conv-item strong,.conv-item small,.conv-item span{display:block}.conv-item small,.conv-item span{font-size:10px;opacity:.8;margin-top:4px}.admin-messages{height:55vh;overflow:auto;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;margin-bottom:12px}.admin-send{display:flex;gap:8px}.admin-send input{flex:1;min-width:0}.admin-send input,.admin-input{font:inherit}.admin-send button,.admin-actions button{border:0;border-radius:4px;padding:10px 14px;background:#547c58;color:white;font-weight:700}.admin-actions{display:flex;gap:8px;margin:10px 0}.admin-actions button.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}#adminStatus{font-size:12px;color:var(--muted);min-height:20px}.no-conv{color:var(--muted);text-align:center;padding:35px 10px}@media(max-width:700px){.admin-layout{grid-template-columns:1fr}.conv-list{max-height:260px}.admin-messages{height:45vh}.admin-top{align-items:flex-start;flex-direction:column}}
body{font-family:'Tajawal','Cairo',Arial,sans-serif;font-size:16px;font-weight:500}h1,h2,h3,button{font-family:'Cairo','Tajawal',Arial,sans-serif}body{color:#26352a}input,textarea,select{font:inherit}::placeholder{opacity:1;color:#687365}@media(prefers-color-scheme:dark){body{color:#f7f3e8;background:#171b15}input,textarea,select{background:#22281f;color:#f7f3e8;border-color:#59634c}::placeholder{color:#c0c8b5}}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head><body>
<header class="site-header"><a class="brand" href="index.html"><img src="logo.jpg" alt=""><span>alexorgant<small>COSMETICS</small></span></a><span>لوحة إدارة المحادثات</span><button id="adminLogout" class="icon-btn" hidden>↪</button></header>
<main class="admin-chat-wrap"><section id="loginCard" class="admin-card login-card"><p class="eyebrow">ADMIN ACCESS</p><h1>تسجيل دخول الإدارة</h1><form id="loginForm"><label>البريد الإلكتروني<input id="adminEmail" class="admin-input" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="adminPassword" class="admin-input" type="password" autocomplete="current-password" required></label><button class="primary-btn full" type="submit">دخول</button></form></section>
<section id="chatAdmin" hidden><div class="admin-top"><div><p class="eyebrow">CUSTOMER CARE</p><h1>محادثات العملاء</h1><p class="fine-print">الرسائل تتحدث تلقائيًا كل 5 ثوانٍ.</p></div><button id="refreshChats" class="primary-btn">تحديث المحادثات</button></div><div class="admin-layout"><section class="admin-card"><h2>قائمة المحادثات</h2><div id="conversationList" class="conv-list"><p class="no-conv">جاري التحميل...</p></div></section><section class="admin-card"><h2 id="selectedTitle">اختاري محادثة</h2><div id="adminMessages" class="admin-messages"><p class="no-conv">اختاري محادثة من القائمة للرد.</p></div><div class="admin-actions"><button id="toggleStatus" class="secondary" disabled>إغلاق المحادثة</button></div><form id="adminSendForm" class="admin-send"><input id="adminMessageInput" class="admin-input" placeholder="اكتبي الرد..." maxlength="1500" required disabled><button type="submit" disabled>إرسال</button></form></section></div></section><p id="adminStatus" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const supabaseClient=window.supabase.createClient('https://nzckjiqygjxaguxvgzwo.supabase.co','sb_publishable_4azFT8K7YjPnGG8s5LIzBw_pPWzAdZj');const $=s=>document.querySelector(s);let current=null;let conversations=[];let timer=null;const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function status(s){$('#adminStatus').textContent=s||''}function activeUI(on){$('#loginCard').hidden=on;$('#chatAdmin').hidden=!on;$('#adminLogout').hidden=!on}
async function login(e){e.preventDefault();status('جاري تسجيل الدخول...');const {error}=await supabaseClient.auth.signInWithPassword({email:$('#adminEmail').value.trim(),password:$('#adminPassword').value});if(error){status('فشل تسجيل الدخول: '+error.message);return}const {data}=await supabaseClient.auth.getUser();if(data.user?.id!=='9c16b4a7-318a-4720-b3b6-7779cf4e928e'){await supabaseClient.auth.signOut();status('الحساب ده مش مصرح له بإدارة الشات.');return}activeUI(true);await loadConversations();if(timer)clearInterval(timer);timer=setInterval(async()=>{await loadConversations(false);if(current)await loadMessages()},5000);status('')}
async function loadConversations(keepStatus=true){const {data,error}=await supabaseClient.rpc('admin_chat_conversations');if(error){status('تعذر تحميل المحادثات: '+error.message);return}conversations=Array.isArray(data)?data:[];$('#conversationList').innerHTML=conversations.map(c=>`<button class="conv-item ${current?.id===c.id?'active':''}" data-id="${c.id}"><strong>${safe(c.customer_name)}</strong><small>${safe(c.phone||'بدون رقم موبايل')} • ${c.status==='open'?'مفتوحة':'مغلقة'}</small><span>${safe(c.last_message||'لا توجد رسائل بعد')}</span><small>${new Date(c.last_message_at).toLocaleString('ar-EG')}</small></button>`).join('')||'<p class="no-conv">لسه مفيش محادثات.</p>';$('#conversationList').querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>selectConversation(b.dataset.id)));if(current){const still=conversations.find(c=>c.id===current.id);if(still)current=still;else current=null;}if(current)renderSelected();if(keepStatus)status('')}
async function selectConversation(id){current=conversations.find(c=>c.id===id)||null;renderSelected();await loadMessages();}
function renderSelected(){if(!current)return;$('#selectedTitle').textContent=current.customer_name+(current.phone?' — '+current.phone:'');$('#toggleStatus').disabled=false;$('#toggleStatus').textContent=current.status==='open'?'إغلاق المحادثة':'إعادة فتح المحادثة';$('#adminMessageInput').disabled=current.status!=='open';$('#adminSendForm button').disabled=current.status!=='open';}
async function loadMessages(){if(!current)return;const {data,error}=await supabaseClient.rpc('admin_chat_messages',{p_conversation_id:current.id});if(error){status('تعذر تحميل الرسائل: '+error.message);return}const arr=Array.isArray(data)?data:[];$('#adminMessages').innerHTML=arr.map(m=>`<div class="chat-bubble ${m.sender_role==='admin'?'admin':'customer'}"><p>${safe(m.message)}</p><time>${m.sender_role==='admin'?'الإدارة':'العميل'} • ${new Date(m.created_at).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'})}</time></div>`).join('')||'<p class="no-conv">ابدئي المحادثة بالرد على العميل.</p>';$('#adminMessages').scrollTop=$('#adminMessages').scrollHeight;}
async function sendReply(e){e.preventDefault();if(!current)return;const input=$('#adminMessageInput');const msg=input.value.trim();if(!msg)return;const {error}=await supabaseClient.rpc('admin_chat_reply',{p_conversation_id:current.id,p_message:msg});if(error){status('تعذر إرسال الرد: '+error.message);return}input.value='';await loadMessages();await loadConversations(false);status('تم إرسال الرد.')}
async function toggleStatus(){if(!current)return;const next=current.status==='open'?'closed':'open';const {error}=await supabaseClient.rpc('admin_chat_set_status',{p_conversation_id:current.id,p_status:next});if(error){status('تعذر تغيير الحالة: '+error.message);return}await loadConversations(false);status('تم تحديث حالة المحادثة.')}
$('#loginForm').addEventListener('submit',login);$('#adminSendForm').addEventListener('submit',sendReply);$('#refreshChats').addEventListener('click',()=>loadConversations());$('#toggleStatus').addEventListener('click',toggleStatus);$('#adminLogout').addEventListener('click',async()=>{if(timer)clearInterval(timer);await supabaseClient.auth.signOut();current=null;activeUI(false);status('تم تسجيل الخروج.')});(async()=>{const {data}=await supabaseClient.auth.getSession();if(data.session){const {data:u}=await supabaseClient.auth.getUser();if(u.user?.id==='9c16b4a7-318a-4720-b3b6-7779cf4e928e'){activeUI(true);await loadConversations();timer=setInterval(async()=>{await loadConversations(false);if(current)await loadMessages()},5000)}else await supabaseClient.auth.signOut()}})();
</script></body></html>
